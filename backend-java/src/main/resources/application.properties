# ============================================================
# NWAP India – Spring Boot Application Configuration
# ============================================================

# Server
server.port=8000
spring.application.name=nwap-backend

# ---- Database (SQLite) ----
# Defaults – override via environment variables or .env
app.database-url=${DATABASE_URL:jdbc:sqlite:./weather.db}
spring.datasource.url=${app.database-url}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- API Keys (injected from .env or environment) ----
app.openweather-api-key=${OPENWEATHER_API_KEY:}
app.openweather-base-url=${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
app.openmeteo-base-url=${OPENMETEO_BASE_URL:https://api.open-meteo.com}
app.imd-api-key=${IMD_API_KEY:}
app.imd-base-url=${IMD_BASE_URL:https://api.imd.gov.in}

# ---- AI Configuration ----
app.gemini-api-key=${GEMINI_API_KEY:}
app.groq-api-key=${GROQ_API_KEY:}
app.ai-provider=${AI_PROVIDER:gemini}

# ---- Deduplication & Ingestion ----
app.duplicate-similarity-threshold=${DUPLICATE_SIMILARITY_THRESHOLD:0.70}
app.request-timeout-seconds=${REQUEST_TIMEOUT:15}
app.background-sync-interval-minutes=${BACKGROUND_SYNC_INTERVAL_MINUTES:10}

# ---- CORS ----
app.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}

# ---- App Env ----
app.env=${APP_ENV:development}

# ---- Springdoc / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=alpha

# ---- Scheduling ----
spring.task.scheduling.pool.size=4

# ---- Logging ----
logging.level.com.nwap=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36}: %msg%n
